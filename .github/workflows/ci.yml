name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall src tests

      - name: Run tests
        run: |
          pytest

      - name: Build backend Docker image
        run: |
          docker build -t procom-backend .

      - name: Build frontend Docker image
        run: |
          docker build -t procom-frontend ./frontend

  integration:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    env:
      PYTHONPATH: ${{ github.workspace }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration smoke test
        if: env.GROQ_API_KEY_1 != '' && env.VOYAGE_API_KEY != ''
        run: |
          pytest -m integration

      - name: Skip integration smoke test
        if: env.GROQ_API_KEY_1 == '' || env.VOYAGE_API_KEY == ''
        run: echo "Skipping integration smoke test because live credentials are not available."
